<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#003b4b">
    <meta name="description" content="Shop! :D Connect yourself to prizes, project gear, and $10 grants.">
    <link rel="icon" type="image/svg+xml" href="https://assets.hackclub.com/icon-square.svg">

    <title>Shop! :D | Lost Signal</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="shop.css">
    <script src="static-background.js" defer></script>
    <script src="shop.js" defer></script>
</head>

<body class="shop-page">
    <canvas id="static-background" aria-hidden="true"></canvas>
    <header class="shop-header">
        <a class="hackclub-link" href="https://hackclub.com" target="_blank" rel="noopener noreferrer" aria-label="Visit Hack Club">
            <img class="hackclub-flag" src="assets/hackclub-flag.svg" alt="Hack Club Orpheus flag">
        </a>
        <a class="shop-link" href="index.html">Home</a>
        <a class="shop-logo-link" href="index.html" aria-label="Lost Signal home">
            <img class="shop-logo" src="assets/logo.png" alt="Lost Signal">
        </a>
        <h1>Shop! :D</h1>
        <p class="shop-subtitle">Connect yourself to Prizes!</p>
        <nav class="shop-categories" aria-label="Shop categories">
            <a href="#hardware-electronics">Hardware &amp; Electronics</a>
            <a href="#cool-prizes">Cool Prizes</a>
            <a href="#grants-credits">Grants &amp; Credits</a>
        </nav>
        <div class="shop-region">
            <label for="shipping-region">Where should we ship?</label>
            <div class="shop-region-controls">
                <select id="shipping-region">
                    <option value="north-america">North America</option>
                    <option value="asia">Asia</option>
                    <option value="other">Other region</option>
                </select>
                <input id="shipping-country" type="text" autocomplete="country-name" placeholder="Enter your country or region" aria-label="Country or region" hidden>
            </div>
        </div>
    </header>

    <main class="shop-content" id="shop-products"></main>

    <footer class="site-footer">
        <p class="organizers">BY SEBA, Hridhaan &amp; Ash Goel :)</p>
        <nav class="footer-links" aria-label="Policies and fulfillment">
            <a href="https://hackclub.com/privacy-and-terms#hack-club-standard-terms-and-conditions" target="_blank" rel="noopener noreferrer">Terms of Service</a>
            <a href="https://hackclub.com/privacy-and-terms#hack-club-privacy-notice" target="_blank" rel="noopener noreferrer">Privacy Policy</a>
            <a href="http://forms.hackclub.com/bounty" target="_blank" rel="noopener noreferrer">Fulfillment Bounty</a>
        </nav>
    </footer>

    <dialog class="product-dialog" id="product-dialog" aria-labelledby="dialog-title">
        <form method="dialog">
            <button class="dialog-close" aria-label="Close product details">×</button>
        </form>
        <img class="dialog-image" id="dialog-image" alt="">
        <p class="dialog-category" id="dialog-category"></p>
        <h2 id="dialog-title"></h2>
        <p class="dialog-description" id="dialog-description"></p>
        <p class="dialog-value" id="dialog-value" hidden></p>
        <a class="dialog-buy" id="dialog-buy" target="_blank" rel="noopener noreferrer">link :D</a>
    </dialog>
</body>
</html>
